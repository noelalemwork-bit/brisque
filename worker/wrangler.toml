# Brisque: the game (static assets) and its online backend in one Worker. Free-plan friendly:
# WebSocket Hibernation (idle rooms cost nothing, incoming messages bill 20:1, outgoing free).
name = "brisque"
main = "src/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Lobby"]

[vars]
# origins other than the Worker itself allowed to call the API (itch's game iframe, local dev)
ALLOWED_ORIGINS = "https://html-classic.itch.zone,https://v6p9d9t4.ssl.hwcdn.net,http://localhost:5180,http://localhost:5190,http://127.0.0.1:5190"
MOTH_DAILY_BUDGET = "300"   # Moth API submissions per room per day
MOTH_MINUTE_BUDGET = "20"   # and per minute
MOTH_GLOBAL_DAILY_BUDGET = "600"   # across all rooms

# secrets (never in this file):
#   wrangler secret put MOTH_API_KEY
#   optional voice via JaaS: JAAS_APP_ID, JAAS_KID, JAAS_PRIVATE_KEY (PKCS#8 PEM)
